<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SOLUM showcase</title>
    <style>
      html,
      body {
        margin: 0;
        background: #121211;
        overflow: hidden;
      }
      /* 1920×1080 CSS px; rendered at DPR 2 for 3840×2160. */
      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        transform-origin: 0 0;
      }
      #bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        will-change: transform;
      }
      #scene {
        position: absolute;
        inset: 0;
        perspective: 2800px;
        perspective-origin: 50% 50%;
        transform-style: preserve-3d;
      }
      .group {
        position: absolute;
        inset: 0;
        transform-style: preserve-3d;
      }
      .card {
        position: absolute;
        left: 50%;
        top: 50%;
        /* 62% of the frame width, 16:10 like the screenshots. */
        width: 1190px;
        height: 744px;
        margin: -372px 0 0 -595px;
        border-radius: 14px;
        overflow: hidden;
        background: #f4f1ea;
        box-shadow:
          0 40px 80px -30px rgba(18, 18, 17, 0.45),
          0 10px 24px -10px rgba(18, 18, 17, 0.25);
        backface-visibility: hidden;
        will-change: transform, opacity;
      }
      .card img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <img id="bg" src="assets/coast.jpg" alt="" />
      <div id="scene"></div>
    </div>
    <script src="timeline.js"></script>
  </body>
</html>
